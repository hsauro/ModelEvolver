[package]
name = "evolver-app"
version = "1.0.0"
description = "ModelEvolver desktop and web app (egui)."
edition.workspace = true
license.workspace = true
default-run = "evolver-app"

[[bin]]
name = "evolver-app"
path = "src/main.rs"

# Web Worker entry point (only meaningful on wasm32; a stub natively).
[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
evolver-core = { path = "../evolver-core" }
# glow (WebGL) renderer: smaller than wgpu and works in every browser.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "persistence", "accesskit", "wayland", "x11"] }
egui_plot = "0.38"
egui_extras = "0.37"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Worker messages: compact binary, and unlike JSON it keeps inf/NaN fitness values.
postcard = { version = "1", default-features = false, features = ["alloc"] }
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Navigator",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "DedicatedWorkerGlobalScope",
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "console", "ErrorEvent", "BeforeUnloadEvent",
] }
