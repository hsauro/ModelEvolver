[package]
name = "evolver-core"
version = "0.1.0"
description = "Core of ModelEvolver: reaction networks, diffsol BDF simulation, objectives and the GA. No UI, no threads."
edition.workspace = true
license.workspace = true

[dependencies]
diffsol = { version = "0.20", default-features = false, features = ["nalgebra"] }
serde = { version = "1", features = ["derive"] }
rustfft = "6"
serde_json = "1"
# OS randomness for "random seed" (the browser's crypto API on the web).
getrandom = "0.3"
antimony = { package = "antimony-rs", path = "../antimony", optional = true }

[features]
default = ["antimony"]
antimony = ["dep:antimony", "antimony/sbml"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
