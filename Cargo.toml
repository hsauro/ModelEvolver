[workspace]
resolver = "3"
members = [
    "crates/evolver-core",
    "crates/evolver-app",
    "crates/antimony",
    "crates/sbml-io",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Optimise dependencies (diffsol, nalgebra) even in debug builds: the solver is
# unusably slow unoptimised, and tests/benchmarks run it heavily.
[profile.dev.package."*"]
opt-level = 3
